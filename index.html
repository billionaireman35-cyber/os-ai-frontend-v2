<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>OS AI</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('root').innerHTML = '<div style="padding:2rem;background:#0A1114;color:#E9E4D8;text-align:center;font-family:sans-serif;"><h1>Oops!</h1><p>An error occurred: ' + message + '</p></div>';
        console.error('Global error:', message, source, lineno, colno, error);
      };
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#0A1114; color:#E9E4D8; font-family:Inter, sans-serif; font-size:24px;">
        Loading OS AI...
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
