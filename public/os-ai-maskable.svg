<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <radialGradient id="bg" cx="18%" cy="82%" r="105%">
      <stop offset="0%" stop-color="#052c20"/>
      <stop offset="55%" stop-color="#111418"/>
      <stop offset="100%" stop-color="#090b0d"/>
    </radialGradient>

    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffb4" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#64ffb4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#64ffb4" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="cursor" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="8"
        flood-color="#000000"
        flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Full background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Subtle green border -->
  <rect
    x="5"
    y="5"
    width="502"
    height="502"
    rx="108"
    fill="none"
    stroke="url(#edge)"
    stroke-width="5"/>

  <!-- OS AI cursor -->
  <g
    transform="scale(0.72)"
    transform-origin="256 256"
    filter="url(#shadow)">

    <path
      d="M256 130
         L157 322
         L224 293
         L252 382
         L285 370
         L257 281
         L327 292
         Z"
      fill="url(#cursor)"/>

    <!-- Inward green notch -->
    <path
      d="M224 293
         L252 382
         L266 377
         L238 288
         Z"
      fill="#052c20"/>

  </g>

</svg>
